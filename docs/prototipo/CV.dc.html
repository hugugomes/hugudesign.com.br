<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hugu Gomes — Currículo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
a:hover{opacity:.8}
</style>
</helmet>
<div style="background: {{c.bg}}; color: {{c.ink}}; font-family: 'Archivo', system-ui, sans-serif; min-height: 100vh; padding: 0 24px 80px;">
  <nav style="max-width: 1040px; margin: 0 auto; padding: 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;" aria-label="Currículo">
    <a href="Main.dc.html" style="height: 44px; display: inline-flex; align-items: center; text-decoration: none; font-weight: 600;">← hugudesign.com.br</a>
    <div style="display: flex; gap: 8px; align-items: center;">
      <div role="group" aria-label="Idioma" style="display: flex; padding: 3px; border: 1px solid {{c.line}}; border-radius: 999px;">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="min-width: 44px; height: 36px; border: 0; border-radius: 999px; font: 600 12px/1 'Archivo', sans-serif; letter-spacing: .08em; cursor: pointer; background: {{l.bg}}; color: {{l.fg}};">{{l.code}}</button>
        </sc-for>
      </div>
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{t.themeLabel}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{c.line}}; background: transparent; color: {{c.ink}}; cursor: pointer;">◐</button>
      <a href="#pdf" style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 999px; background: {{c.accent}}; color: {{c.accentInk}}; text-decoration: none; font-weight: 600; font-size: 14px;">{{t.download}}</a>
    </div>
  </nav>

  <main style="max-width: 1040px; margin: 24px auto 0; display: flex; flex-direction: column; gap: 56px;">
    <header style="display: flex; gap: 28px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid {{c.line}}; padding-bottom: 40px;">
      <div style="width: 120px; height: 120px; border-radius: 50%; overflow: hidden; flex-shrink: 0;">
        <img src="/_blob/bccf77d8bc18f0713b340340e3812c21" alt="Hugu Gomes" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 320px;">
        <h1 style="margin: 0; font-stretch: 75%; font-weight: 900; font-size: clamp(44px, 6vw, 72px); line-height: .9; letter-spacing: -.01em;">HUGO “HUGU” GOMES</h1>
        <p style="margin: 0; font-size: 19px;">{{t.role}}</p>
        <p style="margin: 0; font-size: 15px; color: {{c.muted}};">{{t.place}} · [contato@hugudesign.com.br] · +55 11 98073-7232 · {{t.langs}}</p>
      </div>
    </header>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px;">
      <h2 style="margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: {{c.muted}};">{{t.hSummary}}</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.65; grid-column: span 2;">{{t.summary}}</p>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 16px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: {{c.muted}};">{{t.hExp}}</h2>
      <sc-for list="{{exp}}" as="e" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 32px; padding: 22px 0; border-top: 1px solid {{c.line}};">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <strong style="font-size: 19px;">{{e.org}}</strong>
            <span style="font-size: 15px; color: {{c.muted}};">{{e.when}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2;">
            <span style="font-size: 17px; font-weight: 600;">{{e.role}}</span>
            <span style="font-size: 16px; line-height: 1.6; color: {{c.muted}};">{{e.text}}</span>
          </div>
        </div>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h2 style="margin: 0 0 16px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: {{c.muted}};">{{t.hEdu}}</h2>
        <sc-for list="{{edu}}" as="d" hint-placeholder-count="4">
          <div style="padding: 16px 0; border-top: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 4px;">
            <strong style="font-size: 17px;">{{d.what}}</strong>
            <span style="font-size: 15px; color: {{c.muted}};">{{d.where}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h2 style="margin: 0 0 16px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: {{c.muted}};">{{t.hTools}}</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid {{c.line}}; padding-top: 16px;">
          <sc-for list="{{tools}}" as="s" hint-placeholder-count="8">
            <span style="padding: 8px 14px; border-radius: 999px; border: 1px solid {{c.line}}; font-size: 14px;">{{s.name}}</span>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":2600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'pt', dark: false }; }
  renderVals() {
    const L = this.state.lang, dark = this.state.dark;
    const T = {

</script>
</body>
</html>
