# CI mínima da base (issue #1). A issue #4 expande com lint, testes, e2e e cobertura.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Sem package-lock.json ainda: instala e gera o lockfile.
      # Num PR, o lockfile novo volta para a própria branch num commit automático.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Commit lockfile (PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: gera package-lock.json"
            git push
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
